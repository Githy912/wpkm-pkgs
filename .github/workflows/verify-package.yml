name: Verify WPKM Package

on:
pull_request:
types:
- opened
- synchronize
- reopened
paths:
- "packages/**"

permissions:
contents: write
pull-requests: write

jobs:
verify:
name: Verify package SHA3-512
runs-on: ubuntu-latest

steps:
  - name: Checkout pull request
    uses: actions/checkout@v4
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  - name: Find package
    id: package
    shell: bash
    run: |
      set -euo pipefail

      mapfile -t packages < <(
        find packages \
          -mindepth 1 \
          -maxdepth 1 \
          -type d \
          -printf '%f\n'
      )

      if [ "${#packages[@]}" -eq 0 ]; then
        echo "::error::No package directory was found under packages/"
        exit 1
      fi

      if [ "${#packages[@]}" -gt 1 ]; then
        echo "::error::Multiple package directories were found."
        printf 'Found: %s\n' "${packages[@]}"
        exit 1
      fi

      package="${packages[0]}"

      echo "Package: $package"
      echo "name=$package" >> "$GITHUB_OUTPUT"

  - name: Validate package files
    shell: bash
    run: |
      set -euo pipefail

      package="${{ steps.package.outputs.name }}"
      package_dir="packages/$package"

      manifest="$package_dir/manifest.json"
      hash_file="$package_dir/SHA3-512"

      if [ ! -f "$manifest" ]; then
        echo "::error::Missing $manifest"
        exit 1
      fi

      if [ ! -f "$hash_file" ]; then
        echo "::error::Missing $hash_file"
        exit 1
      fi

      echo "Manifest: $manifest"
      echo "Hash file: $hash_file"

  - name: Read and validate manifest
    id: manifest
    shell: bash
    run: |
      set -euo pipefail

      package="${{ steps.package.outputs.name }}"
      package_dir="packages/$package"
      manifest="$package_dir/manifest.json"

      python3 - "$manifest" "$package" <<'PY'
      import json
      import os
      import sys
      from pathlib import Path

      manifest_path = Path(sys.argv[1])
      package_name = sys.argv[2]

      try:
          data = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )
      except Exception as exc:
          print(f"::error::Invalid manifest.json: {exc}")
          sys.exit(1)

      required = [
          "name",
          "version",
          "architecture",
          "binary",
          "sha3-512",
      ]

      for field in required:
          if field not in data:
              print(
                  f"::error::manifest.json is missing '{field}'"
              )
              sys.exit(1)

      if data["name"] != package_name:
          print(
              f"::error::Manifest package name "
              f"'{data['name']}' does not match "
              f"directory '{package_name}'"
          )
          sys.exit(1)

      binary = Path(data["binary"])

      if (
          binary.name != data["binary"]
          or binary.is_absolute()
      ):
          print(
              "::error::Manifest binary must be a simple filename"
          )
          sys.exit(1)

      binary_path = manifest_path.parent / binary

      if not binary_path.is_file():
          print(
              "::error::Manifest binary does not exist: "
              f"{binary_path}"
          )
          sys.exit(1)

      claimed_manifest_hash = (
          str(data["sha3-512"]).strip().lower()
      )

      if len(claimed_manifest_hash) != 128:
          print(
              "::error::Manifest SHA3-512 must contain "
              "exactly 128 hexadecimal characters"
          )
          sys.exit(1)

      try:
          int(claimed_manifest_hash, 16)
      except ValueError:
          print(
              "::error::Manifest SHA3-512 contains "
              "non-hexadecimal characters"
          )
          sys.exit(1)

      hash_file = manifest_path.parent / "SHA3-512"

      claimed_file_hash = (
          hash_file.read_text(
              encoding="utf-8"
          ).strip().lower()
      )

      if claimed_file_hash != claimed_manifest_hash:
          print(
              "::error::manifest.json SHA3-512 does not "
              "match SHA3-512 file"
          )
          sys.exit(1)

      with open(
          os.environ["GITHUB_OUTPUT"],
          "a",
          encoding="utf-8",
      ) as output:
          print(
              f"binary={binary}",
              file=output,
          )
          print(
              f"claimed_hash={claimed_manifest_hash}",
              file=output,
          )

      print(f"Package: {package_name}")
      print(f"Version: {data['version']}")
      print(f"Architecture: {data['architecture']}")
      print(f"Binary: {binary}")
      print(
          f"Claimed SHA3-512: "
          f"{claimed_manifest_hash}"
      )
      PY

  - name: Calculate SHA3-512 independently
    id: hash
    shell: bash
    run: |
      set -euo pipefail

      package="${{ steps.package.outputs.name }}"
      binary="${{ steps.manifest.outputs.binary }}"
      binary_path="packages/$package/$binary"

      python3 - "$binary_path" <<'PY'
      import hashlib
      import os
      import sys

      path = sys.argv[1]

      digest = hashlib.sha3_512()

      with open(path, "rb") as file:
          while True:
              chunk = file.read(1024 * 1024)

              if not chunk:
                  break

              digest.update(chunk)

      actual_hash = digest.hexdigest()

      print(f"Actual SHA3-512: {actual_hash}")

      with open(
          os.environ["GITHUB_OUTPUT"],
          "a",
          encoding="utf-8",
      ) as output:
          print(
              f"actual_hash={actual_hash}",
              file=output,
          )
      PY

  - name: Compare SHA3-512
    shell: bash
    run: |
      set -euo pipefail

      claimed="${{ steps.manifest.outputs.claimed_hash }}"
      actual="${{ steps.hash.outputs.actual_hash }}"

      echo
      echo "========================================"
      echo " WPKM SHA3-512 VERIFICATION"
      echo "========================================"
      echo "Claimed: $claimed"
      echo "Actual:  $actual"
      echo

      if [ "$claimed" = "$actual" ]; then
        echo "MATCH SHA3-512"
        echo "Package verification successful."
        echo "========================================"
      else
        echo "MISMATCH SHA3-512"
        echo "The package failed integrity verification."
        echo "========================================"
        exit 1
      fi

  - name: Auto-merge pull request
    if: success()
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
    run: |
      set -euo pipefail

      echo
      echo "========================================"
      echo " WPKM AUTO-MERGE"
      echo "========================================"
      echo "Verification passed."
      echo "Merging pull request #$PR_NUMBER..."
      echo

      gh pr merge "$PR_NUMBER" \
        --repo "$REPOSITORY" \
        --squash \
        --delete-branch

      echo
      echo "Pull request merged successfully."
      echo "Package is now LIVE."
      echo "========================================"
